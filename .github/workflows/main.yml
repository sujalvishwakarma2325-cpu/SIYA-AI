name: SIYA AI Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Setup Permanent Signing Key
        run: |
          set -e
          mkdir -p keystore
          if [ ! -f "keystore/siya.jks" ]; then
            echo "Generating fixed permanent release keystore..."
            keytool -genkey -v \
              -keystore keystore/siya.jks \
              -alias siya \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "SiyaRelease123" \
              -keypass "SiyaRelease123" \
              -dname "CN=SIYA, OU=AI, O=SIYA, L=Bhopal, S=MP, C=IN"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/siya.jks
            git commit -m "Add permanent fixed keystore for seamless updates"
            git pull --rebase origin main || true
            git push origin main || true
          fi
          echo "SIYA_KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore/siya.jks" >> "$GITHUB_ENV"
          echo "SIYA_KEYSTORE_PASSWORD=SiyaRelease123" >> "$GITHUB_ENV"
          echo "SIYA_KEY_PASSWORD=SiyaRelease123" >> "$GITHUB_ENV"

      - name: Create SIYA Engine Project
        shell: bash
        run: |
          set -e
          rm -rf SIYA
          mkdir -p SIYA/app/src/main/java/com/siya/ai
          mkdir -p SIYA/app/src/main/res/values

          cat > SIYA/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SIYA"
          include(":app")
          EOF

          cat > SIYA/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.3.0" apply false
          }
          EOF

          cat > SIYA/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > SIYA/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.siya.ai"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.siya.ai"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 3
                  versionName = "1.2"
              }

              signingConfigs {
                  create("release") {
                      val keystorePath = System.getenv("SIYA_KEYSTORE_PATH") ?: "$rootDir/../keystore/siya.jks"
                      storeFile = file(keystorePath)
                      storePassword = System.getenv("SIYA_KEYSTORE_PASSWORD") ?: "SiyaRelease123"
                      keyAlias = "siya"
                      keyPassword = System.getenv("SIYA_KEY_PASSWORD") ?: "SiyaRelease123"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                  freeCompilerArgs.add("-Xskip-metadata-version-check")
              }
          }

          dependencies {
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
              implementation("com.google.ai.edge.litertlm:litertlm-android:0.16.1")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.json:json:20240303")
          }
          EOF

          cat > SIYA/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.SiyaAI" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#030712</item>
                  <item name="android:navigationBarColor">#030712</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > SIYA/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="SIYA AI"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SiyaAI">

                  <service
                      android:name=".SiyaBackgroundService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > SIYA/app/src/main/java/com/siya/ai/SiyaBackgroundService.kt <<'EOF'
          package com.siya.ai

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder

          class SiyaBackgroundService : Service() {
              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  startSiyaForeground()
              }

              private fun startSiyaForeground() {
                  val channelId = "siya_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "SIYA Active Brain",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }

                  val notification: Notification = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, channelId)
                          .setContentTitle("SIYA AI • Active")
                          .setContentText("Listening for background commands & sensor events")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .build()
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                          .setContentTitle("SIYA AI • Active")
                          .setContentText("Background service running")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .build()
                  }

                  startForeground(1001, notification)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  return START_STICKY
              }
          }
          EOF

          cat > SIYA/app/src/main/java/com/siya/ai/ToolManager.kt <<'EOF'
          package com.siya.ai

          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.net.Uri
          import android.os.BatteryManager
          import android.provider.MediaStore
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.URLEncoder
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.TimeUnit

          class ToolManager(private val context: Context) {
              private val client = OkHttpClient.Builder()
                  .connectTimeout(15, TimeUnit.SECONDS)
                  .readTimeout(25, TimeUnit.SECONDS)
                  .build()

              private var isFlashOn = false

              fun getBatteryStatus(): String {
                  val ifilter = IntentFilter(Intent.ACTION_BATTERY_CHANGED)
                  val batteryStatus = context.registerReceiver(null, ifilter)
                  val level = batteryStatus?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = batteryStatus?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: -1
                  val status = batteryStatus?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                  val isCharging = status == BatteryManager.BATTERY_STATUS_CHARGING || status == BatteryManager.BATTERY_STATUS_FULL
                  val pct = (level * 100) / scale.toFloat()
                  val chargeState = if (isCharging) "Charging connect hai" else "Battery par chal raha hai"
                  return "Aapka phone abhi ${pct.toInt()}% charged hai. $chargeState."
              }

              fun getTimeDate(): String {
                  val sdf = SimpleDateFormat("hh:mm a, EEEE, dd MMMM yyyy", Locale.getDefault())
                  return "Abhi samay hai: ${sdf.format(Date())}."
              }

              fun openCamera(): String {
                  return try {
                      val intent = Intent(MediaStore.ACTION_IMAGE_CAPTURE).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      context.startActivity(intent)
                      "Camera khol diya hai sir, photo click kar sakte hain."
                  } catch (e: Exception) {
                      "Camera open karne me issue aaya: ${e.message}"
                  }
              }

              fun toggleTorch(turnOn: Boolean): String {
                  return try {
                      val cameraManager = context.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      val cameraId = cameraManager.cameraIdList.firstOrNull { id ->
                          val chars = cameraManager.getCameraCharacteristics(id)
                          chars.get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                      } ?: return "Is device me flashlight detect nahi hui."

                      cameraManager.setTorchMode(cameraId, turnOn)
                      isFlashOn = turnOn
                      if (turnOn) "Flashlight on kar di hai." else "Flashlight off kar di hai."
                  } catch (e: Exception) {
                      "Torch command error: ${e.message}"
                  }
              }

              fun openInstalledApp(appName: String): String {
                  val pm = context.packageManager
                  val pkg = when (appName.lowercase()) {
                      "whatsapp" -> "com.whatsapp"
                      "youtube" -> "com.google.android.youtube"
                      "chrome" -> "com.android.chrome"
                      "settings" -> "com.android.settings"
                      else -> null
                  }

                  return try {
                      if (pkg != null) {
                          val intent = pm.getLaunchIntentForPackage(pkg)
                          if (intent != null) {
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              context.startActivity(intent)
                              "$appName launch kar diya hai."
                          } else {
                              "$appName phone me installed nahi mila."
                          }
                      } else {
                          val intent = Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=${URLEncoder.encode(appName, "UTF-8")}"))
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          context.startActivity(intent)
                          "Web search par le chal rahi hoon."
                      }
                  } catch (e: Exception) {
                      "App open error: ${e.message}"
                  }
              }

              suspend fun fetchWeather(city: String): String = withContext(Dispatchers.IO) {
                  try {
                      val cleanCity = if (city.isBlank()) "Bhopal" else city.trim()
                      val url = "https://wttr.in/${URLEncoder.encode(cleanCity, "UTF-8")}?format=%C:+%t+(Humidity:+%h)"
                      val request = Request.Builder()
                          .url(url)
                          .header("User-Agent", "curl/7.68.0")
                          .build()
                      client.newCall(request).execute().use { response ->
                          val text = response.body?.string()?.trim() ?: ""
                          if (text.isNotBlank() && !text.contains("<html")) {
                              "Mausam report ($cleanCity): $text"
                          } else {
                              "Mausam jankari fetch nahi ho saki."
                          }
                      }
                  } catch (e: Exception) {
                      "Weather error: ${e.message}"
                  }
              }

              suspend fun askIntelligentBrain(prompt: String): String = withContext(Dispatchers.IO) {
                  try {
                      val statusReq = Request.Builder()
                          .url("https://duckduckgo.com/duckchat/v1/status")
                          .header("x-vqd-accept", "1")
                          .header("User-Agent", "Mozilla/5.0 (Android; Mobile)")
                          .build()

                      val vqdToken = client.newCall(statusReq).execute().use { res ->
                          res.header("x-vqd-4") ?: ""
                      }

                      if (vqdToken.isNotEmpty()) {
                          val messages = JSONArray().apply {
                              put(JSONObject().apply {
                                  put("role", "user")
                                  put("content", "You are SIYA, a witty and sharp Jarvis-like personal AI assistant. Reply helpfully, naturally and concisely in Hindi or Hinglish. Always answer the question directly. User query: $prompt")
                              })
                          }

                          val payload = JSONObject().apply {
                              put("model", "gpt-4o-mini")
                              put("messages", messages)
                          }

                          val postReq = Request.Builder()
                              .url("https://duckduckgo.com/duckchat/v1/chat")
                              .header("x-vqd-4", vqdToken)
                              .header("Content-Type", "application/json")
                              .header("Accept", "text/event-stream")
                              .header("User-Agent", "Mozilla/5.0 (Android; Mobile)")
                              .post(payload.toString().toRequestBody("application/json".toMediaType()))
                              .build()

                          val reply = StringBuilder()
                          client.newCall(postReq).execute().use { res ->
                              res.body?.source()?.let { source ->
                                  while (!source.exhausted()) {
                                      val line = source.readUtf8Line() ?: break
                                      if (line.startsWith("data: ") && !line.contains("[DONE]")) {
                                          try {
                                              val chunk = JSONObject(line.substring(6))
                                              if (chunk.has("message")) {
                                                  reply.append(chunk.getString("message"))
                                              }
                                          } catch (_: Exception) {}
                                      }
                                  }
                              }
                          }
                          val result = reply.toString().trim()
                          if (result.isNotBlank()) return@withContext result
                      }

                      val enc = URLEncoder.encode(prompt, "UTF-8")
                      val searchReq = Request.Builder()
                          .url("https://api.duckduckgo.com/?q=$enc&format=json&no_html=1&skip_disambig=1")
                          .build()
                      client.newCall(searchReq).execute().use { res ->
                          val s = res.body?.string() ?: "{}"
                          val json = JSONObject(s)
                          val abstract = json.optString("AbstractText", "")
                          if (abstract.isNotBlank()) abstract else "Mai SIYA hoon sir. Mai aapke device ke apps (Camera, Torch, YouTube), battery status, mausam, aur sawalon ke jawab de sakti hoon."
                      }
                  } catch (e: Exception) {
                      "Mai SIYA hoon sir. Boliye, aapke device me kya action perform karna hai?"
                  }
              }
          }
          EOF

          cat > SIYA/app/src/main/java/com/siya/ai/MainActivity.kt <<'EOF'
          package com.siya.ai

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.View
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import kotlinx.coroutines.*
          import java.util.Locale

          class MainActivity : Activity(), TextToSpeech.OnInitListener {
              private lateinit var toolManager: ToolManager
              private lateinit var chat: TextView
              private lateinit var input: EditText
              private lateinit var askBtn: Button
              private lateinit var micBtn: Button
              private lateinit var status: TextView

              private var tts: TextToSpeech? = null
              private var speechRecognizer: SpeechRecognizer? = null
              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  toolManager = ToolManager(this)
                  tts = TextToSpeech(this, this)

                  setupUI()
                  checkPermissions()
                  startServiceBackground()
                  initSpeechRecognizer()
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.language = Locale("hi", "IN")
                      tts?.setSpeechRate(1.05f)
                  }
              }

              private fun speakOut(text: String) {
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "SIYA_TTS")
              }

              private fun checkPermissions() {
                  val perms = mutableListOf<String>()
                  if (checkSelfPermission(android.Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      perms.add(android.Manifest.permission.RECORD_AUDIO)
                  }
                  if (checkSelfPermission(android.Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      perms.add(android.Manifest.permission.CAMERA)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          perms.add(android.Manifest.permission.POST_NOTIFICATIONS)
                      }
                  }
                  if (perms.isNotEmpty()) {
                      requestPermissions(perms.toTypedArray(), 101)
                  }
              }

              private fun startServiceBackground() {
                  try {
                      val sIntent = Intent(this, SiyaBackgroundService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(sIntent)
                      } else {
                          startService(sIntent)
                      }
                  } catch (_: Exception) {}
              }

              private fun initSpeechRecognizer() {
                  if (SpeechRecognizer.isRecognitionAvailable(this)) {
                      speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this).apply {
                          setRecognitionListener(object : RecognitionListener {
                              override fun onReadyForSpeech(params: Bundle?) {
                                  status.text = "● LISTENING..."
                                  status.setTextColor(Color.YELLOW)
                              }
                              override fun onBeginningOfSpeech() {}
                              override fun onRmsChanged(rmsdB: Float) {}
                              override fun onBufferReceived(buffer: ByteArray?) {}
                              override fun onEndOfSpeech() {
                                  status.text = "● PROCESSING VOICE..."
                                  status.setTextColor(Color.parseColor("#00E5FF"))
                              }
                              override fun onError(error: Int) {
                                  status.text = "● SIYA V1.2 • BRAIN ONLINE"
                                  status.setTextColor(Color.parseColor("#00E676"))
                              }
                              override fun onResults(results: Bundle?) {
                                  val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                                  if (!matches.isNullOrEmpty()) {
                                      val spokenText = matches[0]
                                      input.setText(spokenText)
                                      executeSiyaCommand(spokenText)
                                  }
                                  status.text = "● SIYA V1.2 • BRAIN ONLINE"
                                  status.setTextColor(Color.parseColor("#00E676"))
                              }
                              override fun onPartialResults(partialResults: Bundle?) {}
                              override fun onEvent(eventType: Int, params: Bundle?) {}
                          })
                      }
                  }
              }

              private fun listenVoice() {
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                      putExtra(RecognizerIntent.EXTRA_PROMPT, "SIYA sun rahi hai, boliye...")
                  }
                  speechRecognizer?.startListening(intent)
              }

              private fun setupUI() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#050811"))
                      setPadding(30, 45, 30, 25)
                  }

                  val title = TextView(this).apply {
                      text = "SIYA • PERSONAL AI"
                      textSize = 24f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }
                  root.addView(title)

                  status = TextView(this).apply {
                      text = "● SIYA V1.2 • BRAIN & VOICE ACTIVE"
                      textSize = 13f
                      gravity = Gravity.CENTER
                      setTextColor(Color.parseColor("#00E676"))
                  }
                  val sParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = 8 }
                  root.addView(status, sParams)

                  val scroll = ScrollView(this)
                  chat = TextView(this).apply {
                      text = "SIYA: Namaste! Mai aapki personal AI assistant SIYA hoon. Mic daba kar boliye ya type kijiye."
                      textSize = 15f
                      setTextColor(Color.parseColor("#ECEFF1"))
                      setPadding(15, 20, 15, 20)
                  }
                  scroll.addView(chat)
                  val scParams = LinearLayout.LayoutParams(-1, 0, 1f).apply { topMargin = 20 }
                  root.addView(scroll, scParams)

                  input = EditText(this).apply {
                      hint = "Message or Speak to SIYA..."
                      setHintTextColor(Color.DKGRAY)
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#10172A"))
                      setPadding(25, 20, 25, 20)
                  }
                  root.addView(input, LinearLayout.LayoutParams(-1, -2))

                  val btnLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }
                  val blParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = 12 }

                  micBtn = Button(this).apply {
                      text = "🎤 VOICE MIC"
                      setBackgroundColor(Color.parseColor("#7C3AED"))
                      setTextColor(Color.WHITE)
                  }
                  btnLayout.addView(micBtn, LinearLayout.LayoutParams(0, -2, 1f))

                  val space = View(this)
                  btnLayout.addView(space, LinearLayout.LayoutParams(15, 1))

                  askBtn = Button(this).apply {
                      text = "SEND"
                      setBackgroundColor(Color.parseColor("#00E5FF"))
                      setTextColor(Color.BLACK)
                  }
                  btnLayout.addView(askBtn, LinearLayout.LayoutParams(0, -2, 1.2f))

                  root.addView(btnLayout, blParams)

                  micBtn.setOnClickListener { listenVoice() }
                  askBtn.setOnClickListener {
                      val text = input.text.toString().trim()
                      if (text.isNotEmpty()) {
                          executeSiyaCommand(text)
                      }
                  }

                  setContentView(root)
              }

              private fun executeSiyaCommand(query: String) {
                  appendLog("YOU", query)
                  input.text.clear()
                  hideKeyboard()

                  val lower = query.lowercase()

                  scope.launch {
                      val isBattery = lower.contains("battery") || lower.contains("charge") || lower.contains("power")
                      val isTime = lower.contains("time") || lower.contains("samay") || lower.contains("tarikh") || lower.contains("date")
                      val isCamera = lower.contains("camera") || lower.contains("photo")
                      val isTorchOn = (lower.contains("torch") || lower.contains("flash")) && (lower.contains("on") || lower.contains("chalu") || lower.contains("jalao"))
                      val isTorchOff = (lower.contains("torch") || lower.contains("flash")) && (lower.contains("off") || lower.contains("band"))
                      val isWhatsApp = lower.contains("whatsapp")
                      val isYouTube = lower.contains("youtube")
                      val isSettings = lower.contains("setting")
                      val isWeather = lower.contains("weather") || lower.contains("mausam")

                      val replyText: String = when {
                          isBattery -> toolManager.getBatteryStatus()
                          isTime -> toolManager.getTimeDate()
                          isCamera -> toolManager.openCamera()
                          isTorchOn -> toolManager.toggleTorch(true)
                          isTorchOff -> toolManager.toggleTorch(false)
                          isWhatsApp -> toolManager.openInstalledApp("whatsapp")
                          isYouTube -> toolManager.openInstalledApp("youtube")
                          isSettings -> toolManager.openInstalledApp("settings")
                          isWeather -> {
                              val city = query.replace("weather", "", true).replace("mausam", "", true).trim()
                              toolManager.fetchWeather(city)
                          }
                          lower in listOf("hii", "hi", "hello", "hey", "gii", "namaste") -> {
                              "Haanji sir! Boliye, mai aapke liye kya kar sakti hoon?"
                          }
                          lower.contains("kya kar sakti ho") || lower.contains("kya kya open") -> {
                              "Sir mai camera khol sakti hoon, torch on/off kar sakti hoon, WhatsApp/YouTube open kar sakti hoon, battery aur samay bata sakti hoon, aur aapke sawalon ke jawab de sakti hoon."
                          }
                          else -> toolManager.askIntelligentBrain(query)
                      }

                      appendLog("SIYA", replyText)
                      speakOut(replyText)
                  }
              }

              private fun appendLog(speaker: String, text: String) {
                  chat.append("\n\n$speaker:\n$text")
                  chat.post {
                      val parent = chat.parent
                      if (parent is ScrollView) parent.fullScroll(View.FOCUS_DOWN)
                  }
              }

              private fun hideKeyboard() {
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(input.windowToken, 0)
              }

              override fun onDestroy() {
                  tts?.stop()
                  tts?.shutdown()
                  speechRecognizer?.destroy()
                  scope.cancel()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build SIYA Signed APK
        working-directory: SIYA
        run: |
          gradle wrapper --gradle-version 8.11.1
          ./gradlew assembleRelease --stacktrace

      - name: Upload SIYA APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYA-AI-APK
          path: SIYA/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
