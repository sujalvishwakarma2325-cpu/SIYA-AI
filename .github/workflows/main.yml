name: SIYA AI Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Setup Permanent Signing Key
        run: |
          set -e
          mkdir -p keystore
          if [ ! -f "keystore/siya.jks" ]; then
            echo "Generating fixed permanent release keystore..."
            keytool -genkey -v \
              -keystore keystore/siya.jks \
              -alias siya \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "SiyaRelease123" \
              -keypass "SiyaRelease123" \
              -dname "CN=SIYA, OU=AI, O=SIYA, L=Bhopal, S=MP, C=IN"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/siya.jks
            git commit -m "Add permanent fixed keystore for seamless updates"
            git pull --rebase origin main || true
            git push origin main || true
          fi
          echo "SIYA_KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore/siya.jks" >> "$GITHUB_ENV"
          echo "SIYA_KEYSTORE_PASSWORD=SiyaRelease123" >> "$GITHUB_ENV"
          echo "SIYA_KEY_PASSWORD=SiyaRelease123" >> "$GITHUB_ENV"

      - name: Create SIYA Engine Project
        shell: bash
        run: |
          set -e
          rm -rf SIYA
          mkdir -p SIYA/app/src/main/java/com/siya/ai
          mkdir -p SIYA/app/src/main/res/values

          cat > SIYA/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SIYA"
          include(":app")
          EOF

          cat > SIYA/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.3.0" apply false
          }
          EOF

          cat > SIYA/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > SIYA/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.siya.ai"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.siya.ai"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 8
                  versionName = "2.0"
              }

              signingConfigs {
                  create("release") {
                      val keystorePath = System.getenv("SIYA_KEYSTORE_PATH") ?: "$rootDir/../keystore/siya.jks"
                      storeFile = file(keystorePath)
                      storePassword = System.getenv("SIYA_KEYSTORE_PASSWORD") ?: "SiyaRelease123"
                      keyAlias = "siya"
                      keyPassword = System.getenv("SIYA_KEY_PASSWORD") ?: "SiyaRelease123"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                  freeCompilerArgs.add("-Xskip-metadata-version-check")
              }
          }

          dependencies {
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
              implementation("com.google.ai.edge.litertlm:litertlm-android:0.16.1")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.json:json:20240303")
          }
          EOF

          cat > SIYA/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.SiyaAI" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#030712</item>
                  <item name="android:navigationBarColor">#030712</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > SIYA/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <queries>
                  <package android:name="com.instagram.android" />
                  <package android:name="com.instagram.lite" />
                  <package android:name="com.spotify.music" />
                  <package android:name="com.spotify.lite" />
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
                  <package android:name="com.google.android.youtube" />
                  <package android:name="com.android.chrome" />
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="SIYA AI"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SiyaAI">

                  <service
                      android:name=".SiyaBackgroundService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > SIYA/app/src/main/java/com/siya/ai/ToolManager.kt <<'EOF'
          package com.siya.ai

          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.BatteryManager
          import android.provider.MediaStore
          import android.view.KeyEvent
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.URLEncoder
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.TimeUnit

          class ToolManager(private val context: Context) {
              private val client = OkHttpClient.Builder()
                  .connectTimeout(12, TimeUnit.SECONDS)
                  .readTimeout(18, TimeUnit.SECONDS)
                  .build()

              private var isFlashOn = false

              // TOOL 1: Battery Engine
              fun getBatteryStatus(): String {
                  val ifilter = IntentFilter(Intent.ACTION_BATTERY_CHANGED)
                  val b = context.registerReceiver(null, ifilter)
                  val level = b?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = b?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: -1
                  val status = b?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                  val isCharging = status == BatteryManager.BATTERY_STATUS_CHARGING || status == BatteryManager.BATTERY_STATUS_FULL
                  val pct = (level * 100) / scale.toFloat()
                  return "Aapka phone ${pct.toInt()}% charged hai. ${if (isCharging) "Charging connect hai ⚡" else "Battery par chal raha hai."}"
              }

              // TOOL 2: Time & Date Engine
              fun getTimeDate(): String {
                  val sdf = SimpleDateFormat("hh:mm a, EEEE, dd MMMM yyyy", Locale.getDefault())
                  return "Abhi samay hai: ${sdf.format(Date())}."
              }

              // TOOL 3: Camera Launcher
              fun openCamera(): String {
                  return try {
                      val intent = Intent(MediaStore.ACTION_IMAGE_CAPTURE).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                      context.startActivity(intent)
                      "Camera chalu kar diya hai sir."
                  } catch (e: Exception) { "Camera error: ${e.message}" }
              }

              // TOOL 4: Flashlight Controller
              fun toggleTorch(turnOn: Boolean): String {
                  return try {
                      val cm = context.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      val id = cm.cameraIdList.firstOrNull { cm.getCameraCharacteristics(it).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true }
                          ?: return "Torch hardware nahi mila."
                      cm.setTorchMode(id, turnOn)
                      isFlashOn = turnOn
                      if (turnOn) "Flashlight on kar di hai." else "Flashlight off kar di hai."
                  } catch (e: Exception) { "Torch error: ${e.message}" }
              }

              // TOOL 5: Universal Media Control
              fun controlMedia(play: Boolean): String {
                  return try {
                      val am = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      val code = if (play) KeyEvent.KEYCODE_MEDIA_PLAY else KeyEvent.KEYCODE_MEDIA_PAUSE
                      am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, code))
                      am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, code))
                      if (play) "Song play kar diya hai sir." else "Song pause kar diya hai sir."
                  } catch (e: Exception) { "Media control error: ${e.message}" }
              }

              // TOOL 6: Instagram Direct Launcher
              fun openInstagram(): String {
                  val pm = context.packageManager
                  for (pkg in listOf("com.instagram.android", "com.instagram.lite")) {
                      val intent = pm.getLaunchIntentForPackage(pkg)
                      if (intent != null) {
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          context.startActivity(intent)
                          return "Instagram open kar diya hai sir."
                      }
                  }
                  return try {
                      val uriIntent = Intent(Intent.ACTION_VIEW, Uri.parse("http://instagram.com/")).apply {
                          setPackage("com.instagram.android")
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      context.startActivity(uriIntent)
                      "Instagram open ho gaya hai."
                  } catch (_: Exception) {
                      val webIntent = Intent(Intent.ACTION_VIEW, Uri.parse("https://www.instagram.com")).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                      context.startActivity(webIntent)
                      "Instagram web khol diya hai."
                  }
              }

              // TOOL 7: App Router (YouTube, WhatsApp, Spotify, Settings)
              fun openApp(name: String): String {
                  if (name.lowercase() == "instagram") return openInstagram()
                  val pm = context.packageManager
                  val list = when (name.lowercase()) {
                      "whatsapp" -> listOf("com.whatsapp", "com.whatsapp.w4b")
                      "youtube" -> listOf("com.google.android.youtube")
                      "spotify" -> listOf("com.spotify.music", "com.spotify.lite")
                      "chrome" -> listOf("com.android.chrome")
                      "settings" -> listOf("com.android.settings")
                      else -> emptyList()
                  }
                  for (pkg in list) {
                      val intent = pm.getLaunchIntentForPackage(pkg)
                      if (intent != null) {
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          context.startActivity(intent)
                          return "$name open kar diya hai sir."
                      }
                  }
                  return searchGoogle(name)
              }

              // TOOL 8: Google Search Redirect
              fun searchGoogle(q: String): String {
                  return try {
                      val intent = Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=${URLEncoder.encode(q, "UTF-8")}")).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      context.startActivity(intent)
                      "Google par '$q' search kar diya hai."
                  } catch (e: Exception) { "Search issue: ${e.message}" }
              }

              // TOOL 9: wttr.in Live Weather API
              suspend fun fetchWeather(city: String): String = withContext(Dispatchers.IO) {
                  try {
                      val clean = if (city.isBlank()) "Bhopal" else city.trim()
                      val url = "https://wttr.in/${URLEncoder.encode(clean, "UTF-8")}?format=%C:+%t+(Humidity:+%h)"
                      val req = Request.Builder().url(url).header("User-Agent", "curl/7.68.0").build()
                      client.newCall(req).execute().use { res ->
                          val body = res.body?.string()?.trim() ?: ""
                          if (body.isNotBlank() && !body.contains("<html")) "Mausam ($clean): $body" else "Mausam jankari nahi mili."
                      }
                  } catch (e: Exception) { "Weather error: ${e.message}" }
              }

              // TOOL 10: Hindi Wikipedia Knowledge API
              suspend fun fetchHindiWiki(query: String): String? = withContext(Dispatchers.IO) {
                  try {
                      val enc = URLEncoder.encode(query.trim(), "UTF-8")
                      val url = "https://hi.wikipedia.org/api/rest_v1/page/summary/$enc"
                      val req = Request.Builder().url(url).build()
                      client.newCall(req).execute().use { res ->
                          val json = JSONObject(res.body?.string() ?: "{}")
                          if (json.has("extract")) json.getString("extract").ifBlank { null } else null
                      }
                  } catch (_: Exception) { null }
              }

              // TOOL 11: English Wikipedia Knowledge API
              suspend fun fetchEnglishWiki(query: String): String? = withContext(Dispatchers.IO) {
                  try {
                      val enc = URLEncoder.encode(query.trim(), "UTF-8")
                      val url = "https://en.wikipedia.org/api/rest_v1/page/summary/$enc"
                      val req = Request.Builder().url(url).build()
                      client.newCall(req).execute().use { res ->
                          val json = JSONObject(res.body?.string() ?: "{}")
                          if (json.has("extract")) json.getString("extract").ifBlank { null } else null
                      }
                  } catch (_: Exception) { null }
              }

              // TOOL 12: Open Exchange Rates Currency API
              suspend fun convertCurrency(amount: Double, from: String, to: String): String = withContext(Dispatchers.IO) {
                  try {
                      val url = "https://open.er-api.com/v6/latest/$from"
                      val req = Request.Builder().url(url).build()
                      client.newCall(req).execute().use { res ->
                          val json = JSONObject(res.body?.string() ?: "{}")
                          val rates = json.getJSONObject("rates")
                          val target = rates.getDouble(to.uppercase())
                          val result = amount * target
                          "$amount $from = ${"%.2f".format(result)} $to"
                      }
                  } catch (e: Exception) { "Currency conversion error: ${e.message}" }
              }

              // TOOL 13: DuckDuckGo Instant Answer API
              suspend fun duckInstantAnswer(query: String): String? = withContext(Dispatchers.IO) {
                  try {
                      val enc = URLEncoder.encode(query, "UTF-8")
                      val url = "https://api.duckduckgo.com/?q=$enc&format=json&no_html=1&skip_disambig=1"
                      val req = Request.Builder().url(url).build()
                      client.newCall(req).execute().use { res ->
                          val json = JSONObject(res.body?.string() ?: "{}")
                          val abstract = json.optString("AbstractText", "")
                          if (abstract.isNotBlank()) abstract else null
                      }
                  } catch (_: Exception) { null }
              }

              // TOOL 14: DuckDuckGo Web Snippet Scraper API
              suspend fun duckWebSnippet(query: String): String? = withContext(Dispatchers.IO) {
                  try {
                      val enc = URLEncoder.encode(query, "UTF-8")
                      val url = "https://html.duckduckgo.com/html/?q=$enc"
                      val req = Request.Builder().url(url).header("User-Agent", "Mozilla/5.0").build()
                      client.newCall(req).execute().use { res ->
                          val html = res.body?.string() ?: ""
                          val match = Regex("""class="result__snippet"[^>]*>(.*?)</a>""").find(html)
                          match?.groupValues?.get(1)?.replace(Regex("<.*?>"), "")?.trim()?.ifBlank { null }
                      }
                  } catch (_: Exception) { null }
              }

              // TOOL 15: Math Calculator Evaluator
              fun evaluateMath(expr: String): String? {
                  return try {
                      val clean = expr.replace("x", "*").replace("X", "*").filter { it.isDigit() || "+-*/.".contains(it) }
                      if (clean.length < 3) return null
                      val parts = clean.split(Regex("(?<=[-+*/])|(?=[-+*/])")).filter { it.isNotBlank() }
                      if (parts.size >= 3) {
                          val n1 = parts[0].toDouble()
                          val op = parts[1]
                          val n2 = parts[2].toDouble()
                          val res = when (op) {
                              "+" -> n1 + n2
                              "-" -> n1 - n2
                              "*" -> n1 * n2
                              "/" -> if (n2 != 0.0) n1 / n2 else "Infinite"
                              else -> null
                          }
                          if (res != null) "Hisab ka jawab: $clean = $res" else null
                      } else null
                  } catch (_: Exception) { null }
              }

              // TOOL 16: Official Joke API
              suspend fun fetchOfficialJoke(): String = withContext(Dispatchers.IO) {
                  try {
                      val req = Request.Builder().url("https://official-joke-api.appspot.com/random_joke").build()
                      client.newCall(req).execute().use { res ->
                          val json = JSONObject(res.body?.string() ?: "{}")
                          "${json.getString("setup")} - ${json.getString("punchline")}"
                      }
                  } catch (_: Exception) { "Ek aadmi doctor ke paas gaya aur bola: Doctor sahab, sab log mujhe ignore karte hain! Doctor: Next please!" }
              }

              // TOOL 17: Hindi Joke Engine
              fun getHindiJoke(): String {
                  val jokes = listOf(
                      "Pappu exam me blank paper chhod kar aa gaya. Teacher: Kuch likha kyu nahi? Pappu: Khamoshi ko alfaaz ki zarurat nahi hoti!",
                      "Master ji: Batao aalashya kya hai? Student: Sab pata hone ke baad bhi jawab na dena!",
                      "Santa: Yaar kal raat sapne me ek ladki ne mujhe propose kiya. Banta: Fir tune kya bola? Santa: Maine bol diya ki mai padhai par focus kar raha hoon!"
                  )
                  return jokes.random()
              }

              // TOOL 18: ZenQuotes Daily Motivational API
              suspend fun fetchMotivationalQuote(): String = withContext(Dispatchers.IO) {
                  try {
                      val req = Request.Builder().url("https://zenquotes.io/api/random").build()
                      client.newCall(req).execute().use { res ->
                          val arr = JSONArray(res.body?.string() ?: "[]")
                          if (arr.length() > 0) {
                              val obj = arr.getJSONObject(0)
                              "\"${obj.getString("q")}\" — ${obj.getString("a")}"
                          } else "Koshish karne walon ki kabhi haar nahi hoti!"
                      }
                  } catch (_: Exception) { "Mehnat itni khamoshi se karo ki safalta shor macha de." }
              }

              // TOOL 19: Advice Slip Life Wisdom API
              suspend fun fetchAdvice(): String = withContext(Dispatchers.IO) {
                  try {
                      val req = Request.Builder().url("https://api.adviceslip.com/advice").build()
                      client.newCall(req).execute().use { res ->
                          val json = JSONObject(res.body?.string() ?: "{}")
                          val slip = json.getJSONObject("slip")
                          "SIYA Advice: ${slip.getString("advice")}"
                      }
                  } catch (_: Exception) { "Hamesha positively socho aur apne lakshya par focus rakho!" }
              }

              // TOOL 20: IP Geolocation City & ISP API
              suspend fun fetchIPDetails(): String = withContext(Dispatchers.IO) {
                  try {
                      val req = Request.Builder().url("http://ip-api.com/json").build()
                      client.newCall(req).execute().use { res ->
                          val json = JSONObject(res.body?.string() ?: "{}")
                          "Network Location: ${json.optString("city", "Unknown")}, ${json.optString("regionName", "")}, Provider: ${json.optString("isp", "Cellular")}"
                      }
                  } catch (e: Exception) { "Network location fetch error: ${e.message}" }
              }

              // High-level Router coordinating all 20 AI engines
              suspend fun processQuery(query: String): String {
                  val lower = query.lowercase().trim()

                  // Math calculation
                  val mathRes = evaluateMath(lower)
                  if (mathRes != null) return mathRes

                  // Jokes & Motivation
                  if (lower.contains("joke") || lower.contains("chutkula") || lower.contains("चुटकुला") || lower.contains("मजाक")) {
                      return if (lower.contains("hindi") || lower.contains("हिंदी")) getHindiJoke() else fetchOfficialJoke()
                  }
                  if (lower.contains("quote") || lower.contains("motivation") || lower.contains("shiksha") || lower.contains("प्रेरणा")) {
                      return fetchMotivationalQuote()
                  }
                  if (lower.contains("advice") || lower.contains("salah") || lower.contains("सलाह")) {
                      return fetchAdvice()
                  }
                  if (lower.contains("location") || lower.contains("network") || lower.contains("ip") || lower.contains("लोकेशन")) {
                      return fetchIPDetails()
                  }

                  // Hardware & Apps
                  if (lower.contains("camera") || lower.contains("photo") || lower.contains("कैमरा")) return openCamera()
                  if (lower.contains("instagram") || lower.contains("insta") || lower.contains("इंस्टाग्राम")) return openInstagram()
                  if (lower.contains("whatsapp") || lower.contains("व्हाट्सएप")) return openApp("whatsapp")
                  if (lower.contains("youtube") || lower.contains("यूट्यूब")) return openApp("youtube")
                  if (lower.contains("spotify") || lower.contains("स्पॉटिफाई")) return openApp("spotify")

                  if ((lower.contains("gana") || lower.contains("song") || lower.contains("गाना")) &&
                      (lower.contains("play") || lower.contains("chalao") || lower.contains("चलाओ") || lower.contains("ऑन"))) {
                      return controlMedia(true)
                  }
                  if ((lower.contains("gana") || lower.contains("song") || lower.contains("गाना")) &&
                      (lower.contains("stop") || lower.contains("pause") || lower.contains("band") || lower.contains("बंद"))) {
                      return controlMedia(false)
                  }

                  if ((lower.contains("torch") || lower.contains("flash") || lower.contains("टॉर्च")) &&
                      (lower.contains("on") || lower.contains("chalu") || lower.contains("jalao") || lower.contains("ऑन") || lower.contains("चालू"))) {
                      return toggleTorch(true)
                  }
                  if ((lower.contains("torch") || lower.contains("flash") || lower.contains("टॉर्च")) &&
                      (lower.contains("off") || lower.contains("band") || lower.contains("ऑफ") || lower.contains("बंद"))) {
                      return toggleTorch(false)
                  }

                  if (lower.contains("battery") || lower.contains("charge") || lower.contains("बैटरी") || lower.contains("चार्ज")) {
                      return getBatteryStatus()
                  }
                  if (lower.contains("time") || lower.contains("samay") || lower.contains("tarikh") || lower.contains("टाइम") || lower.contains("समय")) {
                      return getTimeDate()
                  }
                  if (lower.contains("weather") || lower.contains("mausam") || lower.contains("मौसम")) {
                      val city = query.replace("weather", "", true).replace("mausam", "", true).replace("मौसम", "", true).trim()
                      return fetchWeather(city)
                  }

                  if (lower.contains("convert") || lower.contains("dollar") || lower.contains("डॉलर")) {
                      return convertCurrency(1.0, "USD", "INR")
                  }

                  if (lower.contains("search") || lower.contains("खोजो") || lower.contains("सर्च")) {
                      val cleanQuery = query.replace("search", "", true).replace("सर्च", "", true).replace("खोजो", "", true).trim()
                      return searchGoogle(cleanQuery)
                  }

                  if (lower.contains("kya kya") || lower.contains("kya kar sakti") || lower.contains("features") || lower.contains("क्या-क्या")) {
                      return "Sir mai SIYA hoon! Mere andar 20 AI tools integrate hain: Camera, Instagram, WhatsApp, YouTube, Spotify, Torch, Live Weather, Hindi/English Wikipedia, Currency Converter, Live Location, Math Solver, Jokes, Quotes aur Intelligent Search."
                  }

                  if (lower in listOf("hii", "hi", "hello", "hey", "नमस्ते", "हाय", "हेलो", "हेलो सिया")) {
                      return "Haanji sir! Boliye, mai aapke 20 AI tools ke sath taiyaar hoon. Kya help chahiye?"
                  }

                  // Fallback: Multi-tier Knowledge Search
                  val duckInstant = duckInstantAnswer(query)
                  if (duckInstant != null) return duckInstant

                  val hindiWiki = fetchHindiWiki(query)
                  if (hindiWiki != null) return hindiWiki

                  val engWiki = fetchEnglishWiki(query)
                  if (engWiki != null) return engWiki

                  val duckSnippet = duckWebSnippet(query)
                  if (duckSnippet != null) return duckSnippet

                  return "Aapke sawal '$query' ko analyse kar liya hai sir. Kya ise Google par vistaar se search karein?"
              }
          }
          EOF

          cat > SIYA/app/src/main/java/com/siya/ai/SiyaBackgroundService.kt <<'EOF'
          package com.siya.ai

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch
          import java.util.Locale

          class SiyaBackgroundService : Service(), TextToSpeech.OnInitListener {
              private var speechRecognizer: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private lateinit var toolManager: ToolManager
              private val handler = Handler(Looper.getMainLooper())
              private val serviceScope = CoroutineScope(Dispatchers.Main + SupervisorJob())

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  toolManager = ToolManager(this)
                  tts = TextToSpeech(this, this)
                  startForegroundNotification()
                  initContinuousVoice()
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.language = Locale("hi", "IN")
                      tts?.setSpeechRate(1.05f)
                  }
              }

              fun speak(text: String) {
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "SIYA_BG_TTS")
              }

              private fun startForegroundNotification() {
                  val channelId = "siya_persistent"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "SIYA 20-AI Engine",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }

                  val openAppIntent = Intent(this, MainActivity::class.java).apply {
                      putExtra("TRIGGER_VOICE", true)
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP
                  }
                  val pendingIntent = PendingIntent.getActivity(
                      this,
                      0,
                      openAppIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val notification: Notification = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, channelId)
                          .setContentTitle("SIYA AI • 20 Tools Active")
                          .setContentText("Tap to command or speak anytime")
                          .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                          .setContentIntent(pendingIntent)
                          .setOngoing(true)
                          .build()
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                          .setContentTitle("SIYA AI • 20 Tools Active")
                          .setContentText("Listening in background")
                          .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                          .setContentIntent(pendingIntent)
                          .build()
                  }

                  startForeground(1001, notification)
              }

              private fun initContinuousVoice() {
                  handler.post {
                      try {
                          if (SpeechRecognizer.isRecognitionAvailable(this)) {
                              speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this).apply {
                                  setRecognitionListener(object : RecognitionListener {
                                      override fun onReadyForSpeech(params: Bundle?) {}
                                      override fun onBeginningOfSpeech() {}
                                      override fun onRmsChanged(rmsdB: Float) {}
                                      override fun onBufferReceived(buffer: ByteArray?) {}
                                      override fun onEndOfSpeech() {}
                                      override fun onError(error: Int) { restartListening() }
                                      override fun onResults(results: Bundle?) {
                                          val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                                          if (!matches.isNullOrEmpty()) {
                                              handleSpokenCommand(matches[0])
                                          }
                                          restartListening()
                                      }
                                      override fun onPartialResults(partialResults: Bundle?) {}
                                      override fun onEvent(eventType: Int, params: Bundle?) {}
                                  })
                              }
                              startListeningInternal()
                          }
                      } catch (_: Exception) {}
                  }
              }

              private fun handleSpokenCommand(text: String) {
                  serviceScope.launch {
                      val reply = toolManager.processQuery(text)
                      speak(reply)
                      sendBroadcast(Intent("com.siya.ai.UPDATE_CHAT").apply {
                          putExtra("SPEAKER", "YOU")
                          putExtra("MESSAGE", text)
                      })
                      sendBroadcast(Intent("com.siya.ai.UPDATE_CHAT").apply {
                          putExtra("SPEAKER", "SIYA")
                          putExtra("MESSAGE", reply)
                      })
                  }
              }

              private fun startListeningInternal() {
                  try {
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                      }
                      speechRecognizer?.startListening(intent)
                  } catch (_: Exception) {}
              }

              private fun restartListening() {
                  handler.postDelayed({ startListeningInternal() }, 2000)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val spokenText = intent?.getStringExtra("SPEAK_TEXT")
                  if (!spokenText.isNullOrBlank()) {
                      speak(spokenText)
                  }
                  return START_STICKY
              }

              override fun onDestroy() {
                  serviceScope.cancel()
                  tts?.stop()
                  tts?.shutdown()
                  speechRecognizer?.destroy()
                  super.onDestroy()
              }
          }
          EOF

          cat > SIYA/app/src/main/java/com/siya/ai/MainActivity.kt <<'EOF'
          package com.siya.ai

          import android.app.Activity
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.view.Gravity
          import android.view.View
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import kotlinx.coroutines.*

          class MainActivity : Activity() {
              private lateinit var toolManager: ToolManager
              private lateinit var chat: TextView
              private lateinit var input: EditText
              private lateinit var askBtn: Button
              private lateinit var micBtn: Button
              private lateinit var status: TextView

              private var speechRecognizer: SpeechRecognizer? = null
              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())

              private val chatReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val speaker = intent?.getStringExtra("SPEAKER") ?: return
                      val msg = intent.getStringExtra("MESSAGE") ?: return
                      appendLog(speaker, msg)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  toolManager = ToolManager(this)

                  setupUI()
                  checkPermissions()
                  startServiceBackground()
                  initSpeechRecognizer()

                  val filter = IntentFilter("com.siya.ai.UPDATE_CHAT")
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(chatReceiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(chatReceiver, filter)
                  }

                  handleIntentTriggers(intent)
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  handleIntentTriggers(intent)
              }

              private fun handleIntentTriggers(inIntent: Intent?) {
                  if (inIntent == null) return
                  if (inIntent.getBooleanExtra("TRIGGER_VOICE", false)) {
                      listenVoice()
                  }
              }

              private fun checkPermissions() {
                  val perms = mutableListOf<String>()
                  if (checkSelfPermission(android.Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      perms.add(android.Manifest.permission.RECORD_AUDIO)
                  }
                  if (checkSelfPermission(android.Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      perms.add(android.Manifest.permission.CAMERA)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          perms.add(android.Manifest.permission.POST_NOTIFICATIONS)
                      }
                  }
                  if (perms.isNotEmpty()) {
                      requestPermissions(perms.toTypedArray(), 101)
                  }
              }

              private fun startServiceBackground() {
                  try {
                      val sIntent = Intent(this, SiyaBackgroundService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(sIntent)
                      } else {
                          startService(sIntent)
                      }
                  } catch (_: Exception) {}
              }

              private fun initSpeechRecognizer() {
                  if (SpeechRecognizer.isRecognitionAvailable(this)) {
                      speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this).apply {
                          setRecognitionListener(object : RecognitionListener {
                              override fun onReadyForSpeech(params: Bundle?) {
                                  status.text = "● LISTENING..."
                                  status.setTextColor(Color.YELLOW)
                              }
                              override fun onBeginningOfSpeech() {}
                              override fun onRmsChanged(rmsdB: Float) {}
                              override fun onBufferReceived(buffer: ByteArray?) {}
                              override fun onEndOfSpeech() {
                                  status.text = "● PROCESSING..."
                                  status.setTextColor(Color.parseColor("#00E5FF"))
                              }
                              override fun onError(error: Int) {
                                  status.text = "● SIYA V2.0 • 20 AI TOOLS ACTIVE"
                                  status.setTextColor(Color.parseColor("#00E676"))
                              }
                              override fun onResults(results: Bundle?) {
                                  val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                                  if (!matches.isNullOrEmpty()) {
                                      val spokenText = matches[0]
                                      input.setText(spokenText)
                                      executeCommand(spokenText)
                                  }
                                  status.text = "● SIYA V2.0 • 20 AI TOOLS ACTIVE"
                                  status.setTextColor(Color.parseColor("#00E676"))
                              }
                              override fun onPartialResults(partialResults: Bundle?) {}
                              override fun onEvent(eventType: Int, params: Bundle?) {}
                          })
                      }
                  }
              }

              private fun listenVoice() {
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                      putExtra(RecognizerIntent.EXTRA_PROMPT, "SIYA sun rahi hai, boliye...")
                  }
                  speechRecognizer?.startListening(intent)
              }

              private fun setupUI() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#050811"))
                      setPadding(30, 45, 30, 25)
                  }

                  val title = TextView(this).apply {
                      text = "SIYA • 20-AI ENGINES"
                      textSize = 24f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }
                  root.addView(title)

                  status = TextView(this).apply {
                      text = "● SIYA V2.0 • 20 AI TOOLS ONLINE"
                      textSize = 13f
                      gravity = Gravity.CENTER
                      setTextColor(Color.parseColor("#00E676"))
                  }
                  val sParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = 8 }
                  root.addView(status, sParams)

                  val scroll = ScrollView(this)
                  chat = TextView(this).apply {
                      text = "SIYA: Namaste sir! Mai 20 AI tools ke sath ready hoon. Boliye kya hukm hai?"
                      textSize = 15f
                      setTextColor(Color.parseColor("#ECEFF1"))
                      setPadding(15, 20, 15, 20)
                  }
                  scroll.addView(chat)
                  val scParams = LinearLayout.LayoutParams(-1, 0, 1f).apply { topMargin = 20 }
                  root.addView(scroll, scParams)

                  input = EditText(this).apply {
                      hint = "Message or Speak to SIYA..."
                      setHintTextColor(Color.DKGRAY)
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#10172A"))
                      setPadding(25, 20, 25, 20)
                  }
                  root.addView(input, LinearLayout.LayoutParams(-1, -2))

                  val btnLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }
                  val blParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = 12 }

                  micBtn = Button(this).apply {
                      text = "🎤 VOICE MIC"
                      setBackgroundColor(Color.parseColor("#7C3AED"))
                      setTextColor(Color.WHITE)
                  }
                  btnLayout.addView(micBtn, LinearLayout.LayoutParams(0, -2, 1f))

                  val space = View(this)
                  btnLayout.addView(space, LinearLayout.LayoutParams(15, 1))

                  askBtn = Button(this).apply {
                      text = "SEND"
                      setBackgroundColor(Color.parseColor("#00E5FF"))
                      setTextColor(Color.BLACK)
                  }
                  btnLayout.addView(askBtn, LinearLayout.LayoutParams(0, -2, 1.2f))

                  root.addView(btnLayout, blParams)

                  micBtn.setOnClickListener { listenVoice() }
                  askBtn.setOnClickListener {
                      val text = input.text.toString().trim()
                      if (text.isNotEmpty()) {
                          executeCommand(text)
                      }
                  }

                  setContentView(root)
              }

              private fun executeCommand(query: String) {
                  appendLog("YOU", query)
                  input.text.clear()
                  hideKeyboard()

                  scope.launch {
                      val reply = toolManager.processQuery(query)
                      appendLog("SIYA", reply)
                      val sIntent = Intent(this@MainActivity, SiyaBackgroundService::class.java).apply {
                          putExtra("SPEAK_TEXT", reply)
                      }
                      startService(sIntent)
                  }
              }

              private fun appendLog(speaker: String, text: String) {
                  chat.append("\n\n$speaker:\n$text")
                  chat.post {
                      val parent = chat.parent
                      if (parent is ScrollView) parent.fullScroll(View.FOCUS_DOWN)
                  }
              }

              private fun hideKeyboard() {
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(input.windowToken, 0)
              }

              override fun onDestroy() {
                  unregisterReceiver(chatReceiver)
                  speechRecognizer?.destroy()
                  scope.cancel()
                  super.onDestroy()
              }
          }
