name: SIYA AI Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Setup Permanent Signing Key
        run: |
          set -e
          mkdir -p keystore
          if [ ! -f "keystore/siya.jks" ]; then
            echo "Generating fixed permanent release keystore..."
            keytool -genkey -v \
              -keystore keystore/siya.jks \
              -alias siya \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "SiyaRelease123" \
              -keypass "SiyaRelease123" \
              -dname "CN=SIYA, OU=AI, O=SIYA, L=Bhopal, S=MP, C=IN"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/siya.jks
            git commit -m "Add permanent fixed keystore for seamless updates"
            git pull --rebase origin main || true
            git push origin main || true
          fi
          echo "SIYA_KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore/siya.jks" >> "$GITHUB_ENV"
          echo "SIYA_KEYSTORE_PASSWORD=SiyaRelease123" >> "$GITHUB_ENV"
          echo "SIYA_KEY_PASSWORD=SiyaRelease123" >> "$GITHUB_ENV"

      - name: Create SIYA Engine Project
        shell: bash
        run: |
          set -e
          rm -rf SIYA
          mkdir -p SIYA/app/src/main/java/com/siya/ai
          mkdir -p SIYA/app/src/main/res/values

          cat > SIYA/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SIYA"
          include(":app")
          EOF

          cat > SIYA/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.3.0" apply false
          }
          EOF

          cat > SIYA/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > SIYA/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.siya.ai"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.siya.ai"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }

              signingConfigs {
                  create("release") {
                      val keystorePath = System.getenv("SIYA_KEYSTORE_PATH") ?: "$rootDir/../keystore/siya.jks"
                      storeFile = file(keystorePath)
                      storePassword = System.getenv("SIYA_KEYSTORE_PASSWORD") ?: "SiyaRelease123"
                      keyAlias = "siya"
                      keyPassword = System.getenv("SIYA_KEY_PASSWORD") ?: "SiyaRelease123"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                  freeCompilerArgs.add("-Xskip-metadata-version-check")
              }
          }

          dependencies {
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
              implementation("com.google.ai.edge.litertlm:litertlm-android:0.16.1")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.json:json:20240303")
          }
          EOF

          cat > SIYA/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.SiyaAI" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#030712</item>
                  <item name="android:navigationBarColor">#030712</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > SIYA/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="SIYA AI"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SiyaAI">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > SIYA/app/src/main/java/com/siya/ai/ToolManager.kt <<'EOF'
          package com.siya.ai

          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.BatteryManager
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.URLEncoder
          import java.util.concurrent.TimeUnit

          class ToolManager(private val context: Context) {
              private val client = OkHttpClient.Builder()
                  .connectTimeout(15, TimeUnit.SECONDS)
                  .readTimeout(25, TimeUnit.SECONDS)
                  .build()

              fun getBatteryStatus(): String {
                  val ifilter = IntentFilter(Intent.ACTION_BATTERY_CHANGED)
                  val batteryStatus = context.registerReceiver(null, ifilter)
                  val level = batteryStatus?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = batteryStatus?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: -1
                  val status = batteryStatus?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                  val isCharging = status == BatteryManager.BATTERY_STATUS_CHARGING || status == BatteryManager.BATTERY_STATUS_FULL
                  val pct = (level * 100) / scale.toFloat()
                  val chargeState = if (isCharging) "Charging connect hai ⚡" else "Battery par chal raha hai"
                  return "Aapka phone abhi ${pct.toInt()}% charged hai. ($chargeState)"
              }

              suspend fun fetchWeather(city: String): String = withContext(Dispatchers.IO) {
                  try {
                      val cleanCity = if (city.isBlank()) "Bhopal" else city.trim()
                      val url = "https://wttr.in/${URLEncoder.encode(cleanCity, "UTF-8")}?format=%C:+%t+(Humidity:+%h)"
                      val request = Request.Builder()
                          .url(url)
                          .header("User-Agent", "curl/7.68.0")
                          .build()
                      client.newCall(request).execute().use { response ->
                          val text = response.body?.string()?.trim() ?: ""
                          if (text.isNotBlank() && !text.contains("<html")) {
                              "Mausam report ($cleanCity): $text"
                          } else {
                              "Mausam jankari fetch nahi ho saki."
                          }
                      }
                  } catch (e: Exception) {
                      "Weather error: ${e.message}"
                  }
              }

              suspend fun searchWiki(query: String): String = withContext(Dispatchers.IO) {
                  try {
                      val encoded = URLEncoder.encode(query.trim(), "UTF-8")
                      val url = "https://en.wikipedia.org/api/rest_v1/page/summary/$encoded"
                      val request = Request.Builder().url(url).build()
                      client.newCall(request).execute().use { response ->
                          val data = response.body?.string() ?: return@withContext "No response."
                          val json = JSONObject(data)
                          if (json.has("extract")) json.getString("extract") else "Wikipedia par koi summary nahi mili."
                      }
                  } catch (e: Exception) {
                      "Wiki lookup failed: ${e.message}"
                  }
              }

              suspend fun convertCurrency(amount: Double, from: String, to: String): String = withContext(Dispatchers.IO) {
                  try {
                      val url = "https://open.er-api.com/v6/latest/$from"
                      val request = Request.Builder().url(url).build()
                      client.newCall(request).execute().use { response ->
                          val json = JSONObject(response.body?.string() ?: "{}")
                          val rates = json.getJSONObject("rates")
                          val targetRate = rates.getDouble(to.uppercase())
                          val result = amount * targetRate
                          "$amount $from = ${"%.2f".format(result)} $to"
                      }
                  } catch (e: Exception) {
                      "Calculation error: ${e.message}"
                  }
              }

              suspend fun askFreeCloudAI(prompt: String): String = withContext(Dispatchers.IO) {
                  try {
                      val statusReq = Request.Builder()
                          .url("https://duckduckgo.com/duckchat/v1/status")
                          .header("x-vqd-accept", "1")
                          .header("User-Agent", "Mozilla/5.0 (Android; Mobile)")
                          .build()

                      val vqdToken = client.newCall(statusReq).execute().use { res ->
                          res.header("x-vqd-4") ?: ""
                      }

                      if (vqdToken.isNotEmpty()) {
                          val messages = JSONArray().apply {
                              put(JSONObject().apply {
                                  put("role", "user")
                                  put("content", "You are SIYA, a witty and intelligent Jarvis-like personal AI assistant. Reply helpfully, naturally and concisely in Hindi or Hinglish. User query: $prompt")
                              })
                          }

                          val payload = JSONObject().apply {
                              put("model", "gpt-4o-mini")
                              put("messages", messages)
                          }

                          val postReq = Request.Builder()
                              .url("https://duckduckgo.com/duckchat/v1/chat")
                              .header("x-vqd-4", vqdToken)
                              .header("Content-Type", "application/json")
                              .header("Accept", "text/event-stream")
                              .header("User-Agent", "Mozilla/5.0 (Android; Mobile)")
                              .post(payload.toString().toRequestBody("application/json".toMediaType()))
                              .build()

                          val reply = StringBuilder()
                          client.newCall(postReq).execute().use { res ->
                              res.body?.source()?.let { source ->
                                  while (!source.exhausted()) {
                                      val line = source.readUtf8Line() ?: break
                                      if (line.startsWith("data: ") && !line.contains("[DONE]")) {
                                          try {
                                              val chunk = JSONObject(line.substring(6))
                                              if (chunk.has("message")) {
                                                  reply.append(chunk.getString("message"))
                                              }
                                          } catch (_: Exception) {}
                                      }
                                  }
                              }
                          }
                          val result = reply.toString().trim()
                          if (result.isNotBlank()) return@withContext result
                      }

                      // DuckDuckGo instant answer fallback
                      val enc = URLEncoder.encode(prompt, "UTF-8")
                      val searchReq = Request.Builder()
                          .url("https://api.duckduckgo.com/?q=$enc&format=json&no_html=1&skip_disambig=1")
                          .build()
                      client.newCall(searchReq).execute().use { res ->
                          val s = res.body?.string() ?: "{}"
                          val json = JSONObject(s)
                          val abstract = json.optString("AbstractText", "")
                          if (abstract.isNotBlank()) abstract else "Mai aapki personal assistant SIYA hoon! Boliye, mai kya madad kar sakti hoon?"
                      }
                  } catch (e: Exception) {
                      "Mai aapki personal assistant SIYA hoon. Boliye sir, kya task perform karna hai?"
                  }
              }
          }
          EOF

          cat > SIYA/app/src/main/java/com/siya/ai/ModelDownloader.kt <<'EOF'
          package com.siya.ai

          import android.content.ContentValues
          import android.content.Context
          import android.provider.MediaStore
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          class ModelDownloader(private val context: Context) {
              companion object {
                  private const val MODEL_NAME = "gemma-4-E2B-it.litertlm"
                  private const val DOWNLOAD_PATH = "Download/SIYA_AI"
                  private const val MODEL_URL = "https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm"
                  private const val MODEL_DIRECTORY = "litert_models"
              }

              private val internalModel: File
                  get() = File(File(context.filesDir, MODEL_DIRECTORY), MODEL_NAME)

              suspend fun ensureModel(): Result<String> = withContext(Dispatchers.IO) {
                  try {
                      if (internalModel.exists() && internalModel.length() > 0L) {
                          return@withContext Result.success("Gemma model ready.")
                      }
                      internalModel.parentFile?.mkdirs()
                      val savedUri = findSavedModel()
                      if (savedUri != null) {
                          copyFromDownloads(savedUri)
                          return@withContext Result.success("Gemma model loaded from storage.")
                      }
                      downloadModel()
                      val downloadedUri = findSavedModel() ?: return@withContext Result.failure(Exception("Model missing post-download."))
                      copyFromDownloads(downloadedUri)
                      Result.success("Gemma model ready.")
                  } catch (e: Exception) {
                      Result.failure(Exception("${e.message}"))
                  }
              }

              private fun findSavedModel(): android.net.Uri? {
                  val collection = MediaStore.Downloads.EXTERNAL_CONTENT_URI
                  val projection = arrayOf(MediaStore.Downloads._ID, MediaStore.Downloads.DISPLAY_NAME, MediaStore.Downloads.RELATIVE_PATH)
                  val selection = "${MediaStore.Downloads.DISPLAY_NAME} = ? AND ${MediaStore.Downloads.RELATIVE_PATH} = ?"
                  val selectionArgs = arrayOf(MODEL_NAME, "$DOWNLOAD_PATH/")

                  context.contentResolver.query(collection, projection, selection, selectionArgs, null)?.use { cursor ->
                      if (cursor.moveToFirst()) {
                          val id = cursor.getLong(cursor.getColumnIndexOrThrow(MediaStore.Downloads._ID))
                          return android.content.ContentUris.withAppendedId(collection, id)
                      }
                  }
                  return null
              }

              private fun openConnectionWithRedirects(initialUrl: String): HttpURLConnection {
                  var url = initialUrl
                  var redirects = 0
                  while (redirects < 8) {
                      val connection = URL(url).openConnection() as HttpURLConnection
                      connection.connectTimeout = 40000
                      connection.readTimeout = 120000
                      connection.setRequestProperty("User-Agent", "Mozilla/5.0")
                      connection.instanceFollowRedirects = true
                      connection.connect()

                      val code = connection.responseCode
                      if (code in 300..399) {
                          val newUrl = connection.getHeaderField("Location") ?: break
                          connection.disconnect()
                          url = newUrl
                          redirects++
                      } else {
                          return connection
                      }
                  }
                  return URL(url).openConnection() as HttpURLConnection
              }

              private fun downloadModel() {
                  val values = ContentValues().apply {
                      put(MediaStore.Downloads.DISPLAY_NAME, MODEL_NAME)
                      put(MediaStore.Downloads.MIME_TYPE, "application/octet-stream")
                      put(MediaStore.Downloads.RELATIVE_PATH, "$DOWNLOAD_PATH/")
                      put(MediaStore.Downloads.IS_PENDING, 1)
                  }
                  val collection = MediaStore.Downloads.EXTERNAL_CONTENT_URI
                  val uri = context.contentResolver.insert(collection, values) ?: throw Exception("Storage permission required.")

                  var completed = false
                  try {
                      val connection = openConnectionWithRedirects(MODEL_URL)
                      if (connection.responseCode !in 200..299) throw Exception("HTTP ${connection.responseCode}")

                      connection.inputStream.use { source ->
                          context.contentResolver.openOutputStream(uri)?.use { target ->
                              val buffer = ByteArray(2 * 1024 * 1024)
                              var count: Int
                              while (source.read(buffer).also { count = it } != -1) {
                                  target.write(buffer, 0, count)
                              }
                          }
                      }
                      connection.disconnect()
                      val done = ContentValues().apply { put(MediaStore.Downloads.IS_PENDING, 0) }
                      context.contentResolver.update(uri, done, null, null)
                      completed = true
                  } finally {
                      if (!completed) context.contentResolver.delete(uri, null, null)
                  }
              }

              private fun copyFromDownloads(uri: android.net.Uri) {
                  val tempFile = File(internalModel.parentFile, "$MODEL_NAME.part")
                  context.contentResolver.openInputStream(uri)?.use { input ->
                      tempFile.outputStream().use { output ->
                          val buffer = ByteArray(2 * 1024 * 1024)
                          var count: Int
                          while (input.read(buffer).also { count = it } != -1) {
                              output.write(buffer, 0, count)
                          }
                      }
                  }
                  if (internalModel.exists()) internalModel.delete()
                  tempFile.renameTo(internalModel)
              }
          }
          EOF

          cat > SIYA/app/src/main/java/com/siya/ai/LocalAI.kt <<'EOF'
          package com.siya.ai

          import android.content.Context
          import com.google.ai.edge.litertlm.Backend
          import com.google.ai.edge.litertlm.Conversation
          import com.google.ai.edge.litertlm.Engine
          import com.google.ai.edge.litertlm.EngineConfig
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File

          class LocalAI(private val context: Context) {
              private var engine: Engine? = null
              private var conversation: Conversation? = null
              private var initialized = false
              private val modelFile: File
                  get() = File(File(context.filesDir, "litert_models"), "gemma-4-E2B-it.litertlm")

              suspend fun initialize(): Result<String> = withContext(Dispatchers.IO) {
                  if (initialized) return@withContext Result.success("Engine ready.")
                  if (!modelFile.exists() || modelFile.length() <= 0L) {
                      return@withContext Result.failure(Exception("Gemma model missing."))
                  }
                  try {
                      val config = EngineConfig(modelPath = modelFile.absolutePath, backend = Backend.CPU())
                      val newEngine = Engine(config)
                      newEngine.initialize()
                      engine = newEngine
                      conversation = newEngine.createConversation()
                      initialized = true
                      Result.success("SIYA On-Device Neural Engine Initialized.")
                  } catch (e: Exception) {
                      close()
                      Result.failure(Exception("Model init error: ${e.message}"))
                  }
              }

              suspend fun ask(prompt: String): Result<String> = withContext(Dispatchers.IO) {
                  if (!initialized) initialize()
                  try {
                      val currentConv = conversation ?: return@withContext Result.failure(Exception("Conversation inactive."))
                      val systemPrompt = """
                          You are SIYA, an advanced, highly intelligent Jarvis-style personal assistant.
                          Respond in Hindi, English, or Hinglish accurately according to user preference.
                          Keep responses sharp, precise, and polite.
                          User query: $prompt
                      """.trimIndent()

                      val output = StringBuilder()
                      currentConv.sendMessageAsync(systemPrompt).collect { message ->
                          output.append(message.toString())
                      }
                      Result.success(output.toString().trim())
                  } catch (e: Exception) {
                      Result.failure(Exception("Inference failed: ${e.message}"))
                  }
              }

              fun isReady(): Boolean = initialized && conversation != null

              fun close() {
                  try { conversation?.close() } catch (_: Exception) {}
                  try { engine?.close() } catch (_: Exception) {}
                  conversation = null
                  engine = null
                  initialized = false
              }
          }
          EOF

          cat > SIYA/app/src/main/java/com/siya/ai/MainActivity.kt <<'EOF'
          package com.siya.ai

          import android.app.Activity
          import android.content.Context
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import kotlinx.coroutines.*

          class MainActivity : Activity() {
              private lateinit var localAI: LocalAI
              private lateinit var downloader: ModelDownloader
              private lateinit var toolManager: ToolManager
              private lateinit var chat: TextView
              private lateinit var input: EditText
              private lateinit var askBtn: Button
              private lateinit var status: TextView
              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  localAI = LocalAI(this)
                  downloader = ModelDownloader(this)
                  toolManager = ToolManager(this)

                  setupUI()
                  initSiya()
              }

              private fun initSiya() {
                  status.text = "● SIYA V1.1 • BRAIN ONLINE"
                  status.setTextColor(Color.parseColor("#00E676"))
                  askBtn.isEnabled = true

                  scope.launch {
                      val modelState = downloader.ensureModel()
                      if (modelState.isSuccess) {
                          val initResult = localAI.initialize()
                          if (initResult.isSuccess) {
                              status.text = "● SIYA V1.1 • LOCAL NEURAL ACTIVE"
                              status.setTextColor(Color.parseColor("#00E676"))
                              appendLog("SIYA", "Offline weights synched successfully.")
                          }
                      }
                  }
              }

              private fun setupUI() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#050811"))
                      setPadding(30, 45, 30, 25)
                  }

                  val title = TextView(this).apply {
                      text = "SIYA • PERSONAL AI"
                      textSize = 24f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }
                  root.addView(title)

                  status = TextView(this).apply {
                      text = "● CONNECTED"
                      textSize = 13f
                      gravity = Gravity.CENTER
                      setTextColor(Color.parseColor("#00E5FF"))
                  }
                  val sParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = 8 }
                  root.addView(status, sParams)

                  val scroll = ScrollView(this)
                  chat = TextView(this).apply {
                      text = "SIYA: Namaste! Mai aapki personal AI assistant SIYA hoon. Boliye sir, mai aapke liye kya kar sakti hoon?"
                      textSize = 15f
                      setTextColor(Color.parseColor("#ECEFF1"))
                      setPadding(15, 20, 15, 20)
                  }
                  scroll.addView(chat)
                  val scParams = LinearLayout.LayoutParams(-1, 0, 1f).apply { topMargin = 20 }
                  root.addView(scroll, scParams)

                  input = EditText(this).apply {
                      hint = "Message SIYA..."
                      setHintTextColor(Color.DKGRAY)
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#10172A"))
                      setPadding(25, 20, 25, 20)
                  }
                  root.addView(input, LinearLayout.LayoutParams(-1, -2))

                  askBtn = Button(this).apply {
                      text = "TRANSMIT COMMAND"
                      setBackgroundColor(Color.parseColor("#00E5FF"))
                      setTextColor(Color.BLACK)
                  }
                  val bParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = 12 }
                  root.addView(askBtn, bParams)

                  askBtn.setOnClickListener { executeSiya() }
                  setContentView(root)
              }

              private fun executeSiya() {
                  val query = input.text.toString().trim()
                  if (query.isEmpty()) return

                  appendLog("YOU", query)
                  input.text.clear()
                  hideKeyboard()

                  val lower = query.lowercase()

                  scope.launch {
                      // Quick greetings check
                      if (lower in listOf("hii", "hi", "hello", "hey", "gii", "namaste", "suno")) {
                          appendLog("SIYA", "Haanji! Boliye sir, kya hukm hai? Mai aapki poori madad karne ke liye taiyaar hoon.")
                          return@launch
                      }

                      // Check intent for device tools
                      val isBatteryQuery = lower.contains("battery") || lower.contains("charge") || lower.contains("charging") || lower.contains("power")
                      val isWeatherQuery = lower.contains("weather") || lower.contains("mausam") || lower.contains("tapman") || lower.contains("barish")
                      val isWikiQuery = lower.contains("wiki") || lower.contains("who is") || lower.contains("kaun hai") || lower.contains("kya hai")
                      val isCurrencyQuery = lower.contains("convert") || lower.contains("dollar") || lower.contains("rupee")

                      val toolResponse = when {
                          isBatteryQuery -> toolManager.getBatteryStatus()
                          isWeatherQuery -> {
                              val city = query.replace("weather", "", true)
                                  .replace("mausam", "", true)
                                  .replace("batao", "", true)
                                  .replace("kaisa hai", "", true)
                                  .trim()
                              toolManager.fetchWeather(city)
                          }
                          isWikiQuery -> {
                              val topic = query.replace("wiki", "", true)
                                  .replace("who is", "", true)
                                  .replace("kaun hai", "", true)
                                  .replace("kya hai", "", true)
                                  .trim()
                              toolManager.searchWiki(topic)
                          }
                          isCurrencyQuery -> toolManager.convertCurrency(1.0, "USD", "INR")
                          else -> null
                      }

                      if (toolResponse != null) {
                          appendLog("SIYA (TOOL)", toolResponse)
                      } else {
                          if (localAI.isReady()) {
                              val response = localAI.ask(query)
                              appendLog("SIYA", response.getOrDefault("Processing error."))
                          } else {
                              val cloudAiReply = toolManager.askFreeCloudAI(query)
                              appendLog("SIYA", cloudAiReply)
                          }
                      }
                  }
              }

              private fun appendLog(speaker: String, text: String) {
                  chat.append("\n\n$speaker:\n$text")
                  chat.post {
                      val parent = chat.parent
                      if (parent is ScrollView) parent.fullScroll(View.FOCUS_DOWN)
                  }
              }

              private fun hideKeyboard() {
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(input.windowToken, 0)
              }

              override fun onDestroy() {
                  localAI.close()
                  scope.cancel()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build SIYA Signed APK
        working-directory: SIYA
        run: |
          gradle wrapper --gradle-version 8.11.1
          ./gradlew assembleRelease --stacktrace

      - name: Upload SIYA APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYA-AI-APK
          path: SIYA/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
